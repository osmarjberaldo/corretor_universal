[package]
name = "corretor_universal"
version = "1.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
arboard = "3.4"
enigo = "0.2"
global-hotkey = "0.6"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.26"

# Janelas de popup (menu/balao), deteccao de selecao por UI Automation e
# leitura do mouse: tudo Win32 nativo, por isso so no Windows.
[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

