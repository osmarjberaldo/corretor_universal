<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Corretor Universal</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #18181b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #0ea5e9;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      font-size: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #fafafa;
    }
    .subtitle {
      font-size: 11px;
      color: #a1a1aa;
    }
    .status-card {
      background: #27272a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-online {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge-offline {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .instructions {
      background: #202023;
      border-left: 3px solid #0ea5e9;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.4;
      color: #d4d4d8;
    }
    .instructions code {
      background: #27272a;
      padding: 1px 4px;
      border-radius: 4px;
      font-family: monospace;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">A</div>
    <div>
      <div class="title">Corretor Universal</div>
      <div class="subtitle">Integração com Chrome & Edge</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>App no Windows:</span>
      <span id="status-app" class="badge badge-offline">Verificando...</span>
    </div>
    <div class="status-row">
      <span>Suporte a IA:</span>
      <span id="status-ia" style="color: #a1a1aa; font-size: 12px;">--</span>
    </div>
  </div>

  <div class="instructions">
    <strong>Como usar:</strong><br>
    Selecione qualquer texto em uma página web e clique com o <strong>botão direito</strong>. Escolha <strong>Corretor Universal</strong> para corrigir ou aprimorar com IA!
  </div>

  <script src="popup.js"></script>
</body>
</html>
