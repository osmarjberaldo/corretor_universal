name: "Release Multi-Plataforma"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Versao do Release'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar WiX Toolset v7
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix/releases/download/v7.0.0/wix-cli-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile wix-cli-x64.msi
          Start-Process msiexec -ArgumentList '/i','wix-cli-x64.msi','/qn','/norestart' -Wait
          & "C:\Program Files\WiX Toolset v7.0\bin\wix.exe" --version

      - name: Compilar em Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Empacotar ZIP (.zip)
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          $TAG = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          if (-not $TAG) { $TAG = "v1.1.0" }
          $OUT_DIR = "corretor_universal-${TAG}-windows-x86_64"
          New-Item -ItemType Directory -Path $OUT_DIR -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/corretor_universal.exe" -Destination $OUT_DIR
          Copy-Item "README.md", "LICENSE" -Destination $OUT_DIR
          Start-Sleep -Milliseconds 500
          Compress-Archive -Path "$OUT_DIR/*" -DestinationPath "${OUT_DIR}.zip" -Force
          (Get-FileHash -Path "${OUT_DIR}.zip" -Algorithm SHA256).Hash + "  ${OUT_DIR}.zip" | Out-File -FilePath "${OUT_DIR}.zip.sha256" -Encoding utf8

      - name: Empacotar MSI (.msi)
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          $TAG = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          if (-not $TAG) { $TAG = "v1.1.0" }
          $VERSION = $TAG.TrimStart("v")
          $ROOT = $env:GITHUB_WORKSPACE
          $WIX = "C:\Program Files\WiX Toolset v7.0\bin\wix.exe"
          & $WIX extension add WixToolset.UI.wixext
          $MSI = "corretor_universal-${TAG}-windows-x86_64.msi"
          & $WIX --acceptEula wix7 build packaging/windows/corretor_universal.wxs `
            -arch x64 -ext WixToolset.UI.wixext `
            -d "Versao=$VERSION" `
            -d "Exe=$(Join-Path $ROOT 'target/x86_64-pc-windows-msvc/release/corretor_universal.exe')" `
            -d "Readme=$(Join-Path $ROOT 'README.md')" `
            -d "Licenca=$(Join-Path $ROOT 'LICENSE')" `
            -d "Icone=$(Join-Path $ROOT 'icone.ico')" `
            -d "LicencaRtf=$(Join-Path $ROOT 'packaging/windows/licenca.rtf')" `
            -o $MSI
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o MSI" }
          (Get-FileHash -Path $MSI -Algorithm SHA256).Hash + "  $MSI" | Out-File -FilePath "${MSI}.sha256" -Encoding utf8

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            corretor_universal-*-windows-x86_64.zip*
            corretor_universal-*-windows-x86_64.msi*

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxss-dev \
            libgl1-mesa-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Compilar em Release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Empacotar (.tar.gz)
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TAG="${INPUT_TAG:-v1.1.0}"
          fi
          OUT_DIR="corretor_universal-${TAG}-linux-x86_64"
          mkdir -p "$OUT_DIR"
          cp target/x86_64-unknown-linux-gnu/release/corretor_universal "$OUT_DIR/"
          cp icone.png "$OUT_DIR/corretor-universal.png"
          cp packaging/linux/corretor-universal.desktop "$OUT_DIR/"
          cp packaging/linux/install.sh "$OUT_DIR/"
          cp packaging/linux/uninstall.sh "$OUT_DIR/"
          chmod +x "$OUT_DIR/corretor_universal" "$OUT_DIR/install.sh" "$OUT_DIR/uninstall.sh"
          cp README.md LICENSE "$OUT_DIR/"
          tar -czvf "${OUT_DIR}.tar.gz" -C "$OUT_DIR" .
          sha256sum "${OUT_DIR}.tar.gz" > "${OUT_DIR}.tar.gz.sha256"

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: corretor_universal-*-linux-x86_64.tar.gz*

  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Adicionar target x86_64
        run: rustup target add x86_64-apple-darwin

      - name: Compilar macOS aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Compilar macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Montar Universal Binary e Bundle .app
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          chmod +x packaging/macos/build_app.sh
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TAG="${INPUT_TAG:-v1.1.0}"
          fi
          ./packaging/macos/build_app.sh "$TAG"

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: corretor_universal-*-macos-universal.zip*

  publish-release:
    name: Publicar no GitHub Releases
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist_release/
          merge-multiple: true

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.1.0' }}
          name: "Corretor Universal ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.1.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist_release/*
